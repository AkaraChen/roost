name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs exactly the nightly pinned in rust-toolchain.toml (with rustfmt + clippy).
      - name: Install pinned nightly
        run: |
          rustup toolchain install
          rustc -V
          rustc -V | grep -q nightly || { echo "toolchain is not nightly"; exit 1; }

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo run --example spike
        run: cargo run -p roost --example spike

      - name: cargo run --example zoo
        run: cargo run -p roost --example zoo

      # The spike's cycle tests must depend on the collector. With every collection turned
      # into a no-op they have to fail; if they pass, the assertions don't bite.
      - name: cycle tests fail without GC
        run: |
          if ROOST_SKIP_COLLECT=1 cargo test -p roost --test spike five_; then
            echo "cycle tests passed without running the collector: assertions are toothless"
            exit 1
          fi
          if ROOST_SKIP_COLLECT=1 cargo test -p roost --test class cycle_; then
            echo "class! cycle test passed without running the collector: assertions are toothless"
            exit 1
          fi
          echo "OK: cycle tests fail when collection is skipped"

      # vendor/ is outside the workspace (so our clippy -D warnings doesn't lint upstream
      # code), so its own test suite runs separately, with and without the nightly feature.
      - name: vendored gc test suite
        run: |
          cargo test --manifest-path vendor/gc/Cargo.toml --features nightly,derive
          cargo test --manifest-path vendor/gc/Cargo.toml --features derive

      # `Ref::cast` rebuilds GC pointers from raw parts; Miri checks it under Stacked Borrows,
      # both in the runtime's unit tests and in code generated by `class!`.
      - name: Miri (roost runtime unit tests + class! tests)
        run: |
          rustup component add miri rust-src
          cargo miri test -p roost --lib
          cargo miri test -p roost --test class
