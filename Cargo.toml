[workspace]
resolver = "3"
members = ["roost", "roost-macros"]
# The vendored gc crates are path dependencies but deliberately *not* members: as members
# they would be linted with our `clippy -D warnings`. They are treated like third-party
# code (see vendor/README.md); CI runs their own test suite separately.
exclude = ["vendor"]

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
gc = { path = "vendor/gc", features = ["derive", "nightly"] }
roost-macros = { path = "roost-macros" }
